name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check install.ps1 (syntax, UTF-8 BOM)
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'install.ps1'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$($_.Message) (line $($_.Extent.StartLineNumber))" }; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            Write-Host '::error::install.ps1 must be saved as UTF-8 with BOM (Windows PowerShell 5.1 reads Russian text wrong otherwise)'
            exit 1
          }
          Write-Host 'install.ps1 OK'

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Collect artifact files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/local-ai-chat-${{ steps.sha.outputs.short }}.apk"
          # Скрипт установки (F002) кладётся рядом с APK, когда появится.
          if ls ./*.ps1 >/dev/null 2>&1; then cp ./*.ps1 dist/; fi
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-chat-${{ steps.sha.outputs.short }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
